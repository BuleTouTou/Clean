services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-housing_cleaner}
      POSTGRES_USER: ${POSTGRES_USER:-cleaner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cleaner_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cleaner} -d ${POSTGRES_DB:-housing_cleaner}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-cleaner_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-cleaner_minio_password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-cleaner_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-cleaner_minio_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-clean}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}" &&
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
    restart: "no"

  migrate:
    image: housing-cleaner:local
    command: ["python", "-m", "alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cleaner}:${POSTGRES_PASSWORD:-cleaner_local_password}@postgres:5432/${POSTGRES_DB:-housing_cleaner}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    image: housing-cleaner:local
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cleaner}:${POSTGRES_PASSWORD:-cleaner_local_password}@postgres:5432/${POSTGRES_DB:-housing_cleaner}
      MINIO_ENABLED: "true"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:${MINIO_API_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-cleaner_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-cleaner_minio_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-clean}
      MINIO_SECURE: "false"
      WORK_DIR: /tmp/housing-cleaner
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?set ADMIN_INITIAL_PASSWORD in .env}
      ADMIN_NAME: ${ADMIN_NAME:-系统管理员}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "${APP_PORT:-8765}:8765"
    tmpfs:
      - /tmp/housing-cleaner:size=1g
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
