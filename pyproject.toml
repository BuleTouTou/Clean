[project]
name = "housing-data-cleaner"
version = "0.1.0"
description = "本地运行的北京房源数据清洗工具"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.115",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[tool.uv]
# 本项目是脚本型应用，不构建和安装 Python 包本身。
package = false

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]
